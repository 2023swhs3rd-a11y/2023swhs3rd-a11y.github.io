<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex">
<title>소리 시험 A (보안 설정 없음)</title>
<style>
  body { font: 16px/1.6 -apple-system, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; background: #fffdf4; color: #2b1d2e; }
  button { font: inherit; padding: 10px 16px; margin: 4px 4px 4px 0; border: 2px solid #2b1d2e; background: #ffd36b; cursor: pointer; }
  #log { white-space: pre-wrap; background: #2b1d2e; color: #f4f1de; padding: 12px; min-height: 8em; font-size: 13px; }
</style>
</head>
<body>
<h1>소리 시험 A (보안 설정 없음)</h1>
<p>버튼을 차례로 눌러 보고, 소리가 났는지와 아래 검은 칸의 글을 알려 주세요. 비교용: <a href="csp.html">시험 B (첫 화면과 같은 보안 설정)</a></p>
<button id="a">① 삑 소리 (Web Audio)</button>
<button id="b">② 삑 소리 (새 오디오로 다시)</button>
<button id="c">③ 삑 소리 (audio 태그)</button>
<div id="log"></div>
<script>
  const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
  log(navigator.userAgent.match(/Version\/[\d.]+.*Safari/) ? 'Safari ' + navigator.userAgent.match(/Version\/([\d.]+)/)[1] : navigator.userAgent);
  let ac = null;
  function beep(a) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = 660; g.gain.value = 0.2;
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + 0.25);
    setTimeout(() => log(`  0.3초 뒤: ${a.state}, t=${a.currentTime.toFixed(2)}`), 300);
  }
  document.getElementById('a').onclick = () => {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      log(`① 만든 직후: ${ac.state}, ${ac.sampleRate}Hz`);
      ac.resume().then(() => log('  resume 성공: ' + ac.state), (e) => log('  resume 실패: ' + e));
      beep(ac);
    } catch (e) { log('① 오류: ' + e); }
  };
  document.getElementById('b').onclick = () => {
    try {
      if (ac) ac.close();
      ac = new (window.AudioContext || window.webkitAudioContext)();
      log(`② 새로 만든 직후: ${ac.state}`);
      ac.resume().then(() => log('  resume 성공: ' + ac.state), (e) => log('  resume 실패: ' + e));
      beep(ac);
    } catch (e) { log('② 오류: ' + e); }
  };
  document.getElementById('c').onclick = () => {
    try {
      // 0.25초 삑 소리를 WAV로 만들어 audio 태그로 재생
      const sr = 22050, n = Math.floor(sr / 4), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, (Math.floor(i / (sr / 660 / 2)) % 2 ? 1 : -1) * 6000, true);
      const url = 'data:audio/wav;base64,' + btoa(String.fromCharCode(...new Uint8Array(buf)));
      const el = new Audio(url);
      el.play().then(() => log('③ audio 태그 재생 성공'), (e) => log('③ audio 태그 재생 실패: ' + e));
    } catch (e) { log('③ 오류: ' + e); }
  };
</script>
</body>
</html>
