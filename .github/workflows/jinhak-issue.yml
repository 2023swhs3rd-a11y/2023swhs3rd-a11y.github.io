# '추천 자료 더하기' 이슈 양식(.github/ISSUE_TEMPLATE/jinhak-resource.yml)으로 이슈가 열리거나 고쳐지면
# jinhak/resources.json 에 자료를 넣고, 미리보기 그림을 만들어 main 에 커밋한 뒤 이슈를 닫는다.
# 공개 저장소라 누구나 이슈를 열 수 있으므로 저장소 주인·협업자가 쓴 이슈만 처리한다.
# 이슈 본문은 셸에 넣지 않고 파일로만 넘긴다(scripts/jinhak_issue.py 가 읽는다).
name: 추천 자료 이슈로 더하기
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: write
  issues: write
  pages: write
concurrency:
  group: jinhak-issue
jobs:
  add:
    if: >-
      startsWith(github.event.issue.title, '[추천 자료]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 이슈 내용으로 자료 넣기
        id: add
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/issue.md"
          python3 scripts/jinhak_issue.py "$RUNNER_TEMP/issue.md" | tail -n 1 > "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/result.json"
          python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print('ok=' + ('1' if r['ok'] else '0')); print('id=' + r.get('id', ''))" "$RUNNER_TEMP/result.json" >> "$GITHUB_OUTPUT"
      - name: 미리보기 그림 만들기
        if: steps.add.outputs.ok == '1'
        continue-on-error: true   # 그림이 없어도 화면에는 형태 아이콘이 대신 보인다
        env:
          ID: ${{ steps.add.outputs.id }}
        run: |
          npm i --no-save --no-package-lock playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          NODE_PATH="$PWD/node_modules" node scripts/jinhak_thumbs.mjs "$ID"
      - name: 저장
        id: save
        if: steps.add.outputs.ok == '1'
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git add jinhak/resources.json jinhak/thumbs
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "추천 자료 더하기 (#$NUM)"
          for i in 1 2 3; do git push && break; git pull --rebase; done
      - name: 사이트 다시 빌드 요청
        if: steps.add.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "빌드 요청은 건너뜀(자동 빌드에 맡김)"
      - name: 이슈에 결과 알리기
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          OK: ${{ steps.add.outputs.ok }}
          SAVED: ${{ steps.save.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OK" = "1" ] && [ "$SAVED" != "success" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "자료는 맞게 읽었지만 저장하다 멈췄습니다. 실행 기록: $RUN"
          elif [ "$OK" = "1" ]; then
            python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(('자료를 고쳤습니다' if r.get('updated') else '자료를 넣었습니다') + ': ' + r['title'] + '\n\n몇 분 뒤 https://2023swhs3rd-a11y.github.io/jinhak/ 에 보입니다. 미리보기 그림이 없으면 형태 아이콘이 대신 보입니다.')" "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --reason completed
          elif [ -s "$RUNNER_TEMP/result.json" ]; then
            python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print('넣지 못했습니다: ' + r.get('error', '') + '\n\n이슈 본문을 고쳐 저장하면 다시 시도합니다.')" "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/comment.md"
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          else
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "처리하다 멈췄습니다. 실행 기록: $RUN"
          fi
