# 대입·진로 추천 자료(jinhak/resources.json)를 고칠 때마다 형식 검사
name: 추천 자료 검사
on:
  push:
    branches: [main]
    paths: ["jinhak/**", "scripts/jinhak_data.py", ".github/workflows/jinhak-check.yml"]
  pull_request:
    paths: ["jinhak/**", "scripts/jinhak_data.py", ".github/workflows/jinhak-check.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 형식 검사
        run: python3 scripts/jinhak_data.py
