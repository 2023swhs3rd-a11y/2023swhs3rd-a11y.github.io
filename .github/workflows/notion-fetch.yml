name: notion-fetch (임시)
on:
  push:
    branches: [notion-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def post(path, body):
              req = urllib.request.Request("https://bicjj.notion.site/api/v3/" + path, data=json.dumps(body).encode(),
                    headers={"content-type": "application/json", "user-agent": "Mozilla/5.0"})
              return json.load(urllib.request.urlopen(req, timeout=60))
          def val(b):
              v = b.get("value", {}); return v.get("value", v)
          pid = "3129b73f-fbe4-807c-be00-e0c53617a77e"
          r = post("loadPageChunk", {"pageId": pid, "limit": 500, "cursor": {"stack": []}, "chunkNumber": 0, "verticalColumns": False})
          blocks = dict(r.get("recordMap", {}).get("block", {}))
          for _ in range(6):
              missing = {c for b in blocks.values() for c in val(b).get("content", []) or [] if c not in blocks}
              if not missing: break
              ids = list(missing)
              for i in range(0, len(ids), 80):
                  rr = post("syncRecordValuesMain", {"requests": [{"pointer": {"table": "block", "id": x}, "version": -1} for x in ids[i:i+80]]})
                  blocks.update(rr.get("recordMap", {}).get("block", {}))
          json.dump(blocks, open("notion.json", "w"), ensure_ascii=False)
          print(len(blocks), "blocks")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notion.json && git commit -m "notion dump" && git push
