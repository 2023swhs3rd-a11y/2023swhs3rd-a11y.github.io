name: preview-fetch (임시)
on:
  push:
    branches: [preview-fetch]
    paths: [.github/preview.py, .github/workflows/preview-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick fonts-noto-cjk
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python .github/preview.py
      - run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jinhak/thumbs jinhak/preview-report.json && git commit -m "preview dump" && git push
