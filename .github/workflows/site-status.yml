# 매주 월요일 아침, 진로진학부 사이트(첫 화면과 카드마다 걸린 사이트)와 대입·진로 추천 자료의 링크가 열리는지 점검한다.
# 문제가 있을 때만 이슈 하나('주간 상태 점검')에 결과를 쓰고, 새 문제가 생기면 댓글로 알린다. 모두 정상이면 이슈를 닫는다.
# Actions 탭에서 바로 돌릴 수도 있다. PR에서는 이슈를 건드리지 않고 실행 요약에만 결과를 쓴다.
name: 주간 상태 점검
on:
  schedule:
    - cron: "23 20 * * 0"   # 매주 월요일 05:23 KST
  workflow_dispatch:
  pull_request:
    paths: ["index.html", "jinhak/resources.json", "scripts/site_status.py", "scripts/jinhak_links.py", ".github/workflows/site-status.yml"]
permissions:
  contents: read
  issues: write
concurrency:
  group: site-status
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 사이트 점검
        id: sites
        run: |
          set +e
          python3 scripts/site_status.py --md sites.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 추천 자료 링크 점검
        id: links
        run: |
          set +e
          python3 scripts/jinhak_links.py --md links.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 결과 모으기
        id: report
        run: |
          s=$(head -1 sites.md); l=$(head -1 links.md)
          clean=0
          if grep -q "문제 0곳" <<<"$s" && grep -q "확인 필요 0개 · 깨짐 0개" <<<"$l"; then clean=1; fi
          {
            echo "- $s"
            echo "- 추천 $l"
            echo
            echo "## 사이트"
            echo
            tail -n +2 sites.md
            echo "## 대입·진로 추천 자료 링크"
            echo
            tail -n +2 links.md
          } > report.md
          echo "clean=$clean" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: 이슈에 결과 쓰기
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN: ${{ steps.report.outputs.clean }}
          BROKEN: ${{ steps.sites.outputs.code == '2' || steps.links.outputs.code == '2' }}
        run: |
          title="주간 상태 점검"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ "$CLEAN" = "1" ]; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "모든 사이트와 링크가 열립니다. 이슈를 닫습니다."; fi
            exit 0
          fi
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body-file report.md
            exit 0
          fi
          old=$(gh issue view "$num" --json body --jq .body | head -2)
          gh issue edit "$num" --body-file report.md
          # 깨진 것이 있고 지난주와 결과가 달라졌을 때만 댓글로 알린다
          if [ "$BROKEN" = "true" ] && [ "$old" != "$(head -2 report.md)" ]; then
            gh issue comment "$num" --body "$(head -2 report.md)"
          fi
