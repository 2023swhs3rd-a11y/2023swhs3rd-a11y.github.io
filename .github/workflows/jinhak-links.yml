# 대입·진로 추천 자료의 링크를 매주 점검해 결과를 이슈 하나('추천 자료 링크 점검')에 고쳐 쓴다.
# 깨진 링크가 새로 생기면 댓글을 달아 알리고, 모두 열리면 이슈를 닫는다. Actions 탭에서 바로 돌릴 수도 있다.
name: 추천 자료 링크 점검
on:
  schedule:
    - cron: "23 20 * * 0"   # 매주 월요일 05:23 KST
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: jinhak-links
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 링크 점검
        id: run
        run: |
          set +e
          python3 scripts/jinhak_links.py --md report.md
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: 이슈에 결과 쓰기
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.run.outputs.code }}
        run: |
          title="추천 자료 링크 점검"
          num=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                --jq "map(select(.title == \"$title\"))[0].number // empty")
          clean=$(head -1 report.md | grep -c "확인 필요 0개 · 깨짐 0개" || true)
          if [ "$clean" = "1" ]; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "모든 링크가 열립니다. 이슈를 닫습니다."; fi
            exit 0
          fi
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body-file report.md
            exit 0
          fi
          old=$(gh issue view "$num" --json body --jq .body | head -1)
          gh issue edit "$num" --body-file report.md
          # 깨진 링크가 있고 지난주와 결과가 달라졌을 때만 댓글로 알린다
          if [ "$CODE" = "2" ] && [ "$old" != "$(head -1 report.md)" ]; then
            gh issue comment "$num" --body "$(head -1 report.md)"
          fi
