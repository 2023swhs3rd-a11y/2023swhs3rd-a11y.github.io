# 대입·진로 추천 자료(/jinhak/)에 자료 한 건을 더하는 이슈 양식.
# 저장소 관리자가 이 양식으로 이슈를 열면 .github/workflows/jinhak-issue.yml 이
# jinhak/resources.json 에 자료를 넣고 미리보기 그림을 만든 뒤 main 에 커밋하고 이슈를 닫는다.
# 분류를 더하거나 바꾸면 아래 '분류' 목록도 resources.json 의 categories 와 맞춘다.
name: 추천 자료 더하기
description: 대입·진로 추천 자료(/jinhak/)에 자료 한 건을 더합니다. 저장소 관리자가 올린 것만 자동으로 반영됩니다.
title: "[추천 자료] "
labels: ["추천 자료"]
body:
  - type: markdown
    attributes:
      value: |
        칸을 채워 이슈를 만들면 몇 분 뒤 자동으로 목록에 들어가고 이 이슈가 닫힙니다. 문제가 있으면 이슈에 댓글로 알려 줍니다.
        고칠 것이 있으면 이슈 본문을 수정하면 다시 시도합니다.
  - type: dropdown
    id: cat
    attributes:
      label: 분류
      options:
        - course · 우리 학교 과목 선택
        - explore · 진로 찾기
        - major · 전공·학과 알아보기
        - policy · 대입 제도 이해
        - guide · 대학별 가이드북·선배 이야기
        - exam · 면접·논술
        - college · 전문대학
        - portal · 대입 정보 사이트
        - teacher · 선생님용
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 제목
      placeholder: 2028학년도 대입전형 시행계획 주요 사항
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 주소
      description: https:// 로 시작하는 주소. 구글 드라이브 파일은 '링크가 있는 모든 사용자' 공개여야 미리보기 그림이 만들어집니다.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: src
    attributes:
      label: 펴낸 곳
      placeholder: 한국대학교육협의회
    validations:
      required: true
  - type: textarea
    id: desc
    attributes:
      label: 해설
      description: 무엇이 들어 있고 언제 읽으면 좋은지 두세 문장으로 적습니다.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 형태
      options:
        - 웹사이트
        - PDF
        - 영상
        - 시트
        - 온라인 책자
        - 폴더
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: 대상
      options:
        - 학생
        - 선생님용
    validations:
      required: true
  - type: checkboxes
    id: grade
    attributes:
      label: 볼 만한 학년
      description: 고르지 않으면 전 학년입니다.
      options:
        - label: 고1
        - label: 고2
        - label: 고3
  - type: input
    id: year
    attributes:
      label: 대입 학년도
      description: 특정 학년도 자료일 때만 적습니다(예 2028).
